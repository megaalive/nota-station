name: r1-s2-verify

on:
  push:
    branches:
      - r1/s2-editing-history

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - name: Start server
        run: |
          node tools/serve.mjs >/tmp/notastation-serve.log 2>&1 &
          echo $! >/tmp/notastation-serve.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/nota-station/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/notastation-serve.log
          exit 1
        env:
          BASE_PATH: /nota-station/
          PORT: "4173"
      - name: Browser full
        run: npx playwright test --workers=2 --reporter=list
        env:
          BASE_PATH: /nota-station/
          PORT: "4173"
          CI: ""
          PW_PROJECTS: chromium,firefox
      - if: always()
        run: |
          cat /tmp/notastation-serve.log || true
          if [ -f /tmp/notastation-serve.pid ]; then kill "$(cat /tmp/notastation-serve.pid)" || true; fi

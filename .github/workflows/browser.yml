name: browser tests

# Tes browser lengkap (Chromium + Firefox, §16.3) dipisah dari jalur deploy dan
# hanya jalan saat diminta manual. Alasannya runner GitHub jauh lebih lambat dari
# lokal untuk suite ini, jadi menjalankannya otomatis di tiap push membuat deploy
# tertahan lama tanpa manfaat.
#
# Jalankan dari: Actions → "browser tests" → Run workflow.
# Bisa juga otomatis lewat workflow_run setelah Pages selesai, kalau nanti mau.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Branch/ref yang diuji'
        required: true
        default: 'main'
      projects:
        description: 'Browser yang diuji, dipisah koma (kosong = semua)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - run: npm run test:browser
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          PW_REPORTER: list
          PW_PROJECTS: ${{ inputs.projects }}
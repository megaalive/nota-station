name: R3 S8F-B targeted

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - name: Browser pitch/audio regression
        run: npx playwright test tests/browser/pitch-fx-audio.spec.js tests/browser/pitch-spike.spec.js tests/browser/timing-fx-audio.spec.js tests/browser/mix-fx-audio.spec.js tests/browser/source-fx-audio.spec.js tests/browser/pattern-fx.spec.js

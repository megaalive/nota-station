name: r2-s8-verify

on:
  push:
    branches:
      - r2/s8-global-drop-instrument-picker

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - name: Browser drop/picker
        run: >
          npx playwright test
          tests/browser/global-drop-instrument-picker.spec.js
          tests/browser/pattern.spec.js
          tests/browser/sound-workspace.spec.js
          tests/browser/sound-editor.spec.js
          tests/browser/custom-sample-playback.spec.js
          --workers=2 --reporter=list
        env:
          BASE_PATH: /nota-station/
          PORT: "4173"
          CI: ""
          PW_PROJECTS: chromium,firefox

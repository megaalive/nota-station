name: r1-s12-final-verify

on:
  push:
    branches:
      - r1/s12-r1-automated-exit

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - name: Delta browser R1 exit
        run: npx playwright test tests/browser/r1-exit.spec.js --workers=1 --reporter=list
        env:
          BASE_PATH: /nota-station/
          PORT: "4173"
          CI: ""
          PW_PROJECTS: chromium,firefox

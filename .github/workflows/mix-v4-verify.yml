name: mix-v4-verify

on:
  push:
    branches:
      - r1/uat-mix-v4

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - name: Browser demo/audio
        run: >
          npx playwright test
          tests/browser/demo.spec.js
          tests/browser/sustain-demo.spec.js
          tests/browser/channel-observability.spec.js
          --workers=2 --reporter=list
        env:
          BASE_PATH: /nota-station/
          PORT: "4173"
          CI: ""
          PW_PROJECTS: chromium,firefox

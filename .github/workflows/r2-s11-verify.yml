name: R2 S11 Verification

on:
  push:
    branches:
      - r2/s11-reload-exit-closure
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - name: Browser gate R2-S11
        env:
          CI: "1"
          PW_PROJECTS: chromium,firefox
          PW_REPORTER: list
        run: >-
          npx playwright test
          tests/browser/reload-custom-sample.spec.js
          tests/browser/custom-sample-playback.spec.js
          tests/browser/sound-workspace.spec.js
          tests/browser/drum-ui-factory.spec.js

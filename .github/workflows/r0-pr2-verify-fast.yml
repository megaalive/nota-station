name: r0-pr2-verify-fast

on:
  push:
    branches:
      - fix/r0-shell-completion

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use current Playwright for diagnosis
        run: |
          npm install -D @playwright/test@1.63.0
          echo LOCK_BEGIN
          base64 -w0 package-lock.json
          echo
          echo LOCK_END
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          node tools/serve.mjs >/tmp/notastation-serve.log 2>&1 &
          echo $! >/tmp/notastation-serve.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/nota-station/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/notastation-serve.log
          exit 1
        env:
          BASE_PATH: /nota-station/
          PORT: "4173"
      - name: Chromium R0 shell
        run: npx playwright test tests/browser/boot.spec.js tests/browser/shell.spec.js --project=chromium --workers=1 --reporter=list
        env:
          BASE_PATH: /nota-station/
          PORT: "4173"
          CI: ""
      - if: always()
        run: |
          cat /tmp/notastation-serve.log || true
          if [ -f /tmp/notastation-serve.pid ]; then kill "$(cat /tmp/notastation-serve.pid)" || true; fi

name: R3 S8C Verification

on:
  push:
    branches:
      - r3/s8c-fx-columns
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - name: Browser FX Pattern gate
        env:
          CI: "1"
          PW_PROJECTS: chromium,firefox
          PW_REPORTER: list
        run: >-
          npx playwright test
          tests/browser/pattern-fx.spec.js
          tests/browser/effect-model.spec.js
          tests/browser/pattern-offgrid.spec.js
          tests/browser/shared-pattern-guard.spec.js

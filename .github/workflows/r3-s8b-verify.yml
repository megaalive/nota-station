name: R3 S8B Verification

on:
  push:
    branches:
      - r3/s8b-timing-fx-audio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - name: Browser timing FX gate
        env:
          CI: "1"
          PW_PROJECTS: chromium,firefox
          PW_REPORTER: list
        run: >-
          npx playwright test
          tests/browser/timing-fx-audio.spec.js
          tests/browser/pattern.spec.js
          tests/browser/transport.spec.js

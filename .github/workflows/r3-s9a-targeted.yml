name: R3 S9A targeted

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 1
      PW_PROJECTS: chromium,firefox
      PW_REPORTER: list
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - name: Browser channel capacity + Pattern regressions
        run: npx playwright test tests/browser/channel-capacity.spec.js tests/browser/pattern.spec.js tests/browser/channel-observability.spec.js

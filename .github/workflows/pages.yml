name: Pages

# Jalur deploy: build sekali -> deploy artefak itu -> smoke terhadap build live (§13.1).
#
# Tes browser TIDAK lagi di gate deploy. Job browser di runner GitHub jauh lebih
# lambat dari lokal tanpa penyebab yang sudah diketahui, dan memblokir deploy
# selama itu tidak dapat diterima. Tes browser tetap ada dan wajib jalan:
#   - manual lewat workflow `browser.yml` (Actions → browser tests → Run workflow)
#   - lokal lewat `npm run test:browser` sebelum push
# Ini melonggarkan §13.3 ("deploy hanya setelah verify PASS"): gate deploy sekarang
# adalah unit test + check + build + smoke live.
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Node 24 = LTS "Krypton"; 26 masih Current per nodejs.org (dicek 2026-10-04)
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist

  deploy:
    needs: [build]
    # ref == main, bukan sekadar "bukan PR": workflow_dispatch dari branch lain
    # ikut trigger tapi tidak boleh deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    # Menembak build yang benar-benar live, bukan artefak lokal (§13.4).
    # Smoke hanya Chromium supaya tidak memblokir Pages terlalu lama.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECT_SHA: ${{ github.sha }}
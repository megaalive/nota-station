name: R3 S7A Verification

on:
  push:
    branches:
      - r3/s7a-offgrid-dly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - name: Browser off-grid gate
        env:
          CI: "1"
          PW_PROJECTS: chromium,firefox
          PW_REPORTER: list
        run: >-
          npx playwright test
          tests/browser/pattern-offgrid.spec.js
          tests/browser/pattern.spec.js
          tests/browser/pattern-block.spec.js
          tests/browser/pattern-row-velocity.spec.js

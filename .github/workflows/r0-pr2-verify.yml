name: r0-pr2-verify

on:
  push:
    branches:
      - fix/r0-shell-completion

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Chromium R0 shell
        run: npx playwright test tests/browser/boot.spec.js tests/browser/shell.spec.js --project=chromium --workers=1 --reporter=list
        env:
          BASE_PATH: /nota-station/
